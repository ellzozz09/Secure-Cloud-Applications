name: CI Security Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Terraform plan is deferred until M1 approves read-only OIDC and state access
# for PR workflows. CI must never run terraform apply.

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  python-security:
    name: Python security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Bandit
        shell: bash
        run: |
          if [[ -z "$(find src -type f -name '*.py' -print -quit 2>/dev/null)" ]]; then
            echo "::notice::No Python source under src/ yet; Bandit skipped."
            exit 0
          fi

          python -m pip install --disable-pip-version-check bandit
          bandit -r src

      - name: Audit Python requirements with pip-audit
        shell: bash
        run: |
          mapfile -d '' -t requirement_files < <(
            find . \
              -path './.git' -prune -o \
              -path './.terraform' -prune -o \
              -path './.venv' -prune -o \
              -path './node_modules' -prune -o \
              -type f -name 'requirements*.txt' -print0 |
              sort -z
          )

          if ((${#requirement_files[@]} == 0)); then
            echo "::notice::No requirements*.txt files found; pip-audit skipped."
            exit 0
          fi

          python -m pip install --disable-pip-version-check pip-audit

          for requirements_file in "${requirement_files[@]}"; do
            echo "Auditing ${requirements_file}"
            pip-audit -r "${requirements_file}"
          done

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and run tests
        shell: bash
        run: |
          mapfile -t test_files < <(
            find tests -type f \
              \( -name 'test_*.py' -o -name '*_test.py' \) \
              -print 2>/dev/null |
              sort
          )

          if ((${#test_files[@]} == 0)); then
            echo "::notice::No Python test files found under tests/; pytest skipped."
            exit 0
          fi

          mapfile -d '' -t requirement_files < <(
            find . \
              -path './.git' -prune -o \
              -path './.terraform' -prune -o \
              -path './.venv' -prune -o \
              -path './node_modules' -prune -o \
              -type f -name 'requirements*.txt' -print0 |
              sort -z
          )

          for requirements_file in "${requirement_files[@]}"; do
            echo "Installing ${requirements_file}"
            python -m pip install --disable-pip-version-check -r "${requirements_file}"
          done

          python -m pip install --disable-pip-version-check pytest
          env \
            -u AWS_PROFILE \
            -u AWS_DEFAULT_PROFILE \
            -u AWS_ACCESS_KEY_ID \
            -u AWS_SECRET_ACCESS_KEY \
            -u AWS_SESSION_TOKEN \
            -u AWS_ROLE_ARN \
            -u AWS_WEB_IDENTITY_TOKEN_FILE \
            -u AWS_CONTAINER_CREDENTIALS_RELATIVE_URI \
            -u AWS_CONTAINER_CREDENTIALS_FULL_URI \
            AWS_CONFIG_FILE=/dev/null \
            AWS_SHARED_CREDENTIALS_FILE=/dev/null \
            AWS_EC2_METADATA_DISABLED=true \
            python -m pytest -q

  terraform-validation:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without AWS backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate
